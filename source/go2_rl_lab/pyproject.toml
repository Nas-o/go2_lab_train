[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go2_rl_lab"
version = "0.2.0"
description = "Go2 locomotion training environments implemented with mjlab (MuJoCo Warp)."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Tianyang Wu" },
]
maintainers = [
    { name = "Tianyang Wu" },
]
dependencies = [
    "mjlab==1.2.0",
    "mujoco-warp==3.5.0",
]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.entry-points."mjlab.tasks"]
go2_rl_lab = "go2_rl_lab.tasks"

[project.optional-dependencies]
video = [
    "imageio-ffmpeg>=0.6.0",
]
deploy = [
    "mujoco>=3.5.0",
    "PyYAML>=6.0",
    "pygame>=2.6.0",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["go2_rl_lab*"]

[tool.setuptools.package-data]
go2_rl_lab = [
    "assets/xmls/*.xml",
    "assets/xmls/assets/*.obj",
]
